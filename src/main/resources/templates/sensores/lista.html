<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragmentos/base :: pagina(~{::title}, 'sensores', ~{::section})}">
<head>
    <title>Sensores · AgroTech</title>
</head>
<body>

<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Sensores</h1>

        <a th:href="@{/sensores/nuevo}" class="btn btn-success">
            <i class="bi bi-plus-circle me-2"></i>Nuevo sensor
        </a>
    </div>

    <form th:action="@{/sensores}"
          method="get"
          class="row g-3 align-items-end mb-4">

        <div class="col-md-5">
            <label for="q" class="form-label">
                Nombre o modelo
            </label>

            <input type="search"
                   id="q"
                   name="q"
                   class="form-control"
                   th:value="${q}"
                   placeholder="Escribe para buscar">
        </div>

        <div class="col-md-3">
            <label for="tipo" class="form-label">
                Tipo de sensor
            </label>

            <select id="tipo" name="tipo" class="form-select">
                <option value="">Todos</option>

                <option th:each="t : ${tipos}"
                        th:value="${t}"
                        th:text="${t}"
                        th:selected="${t == tipoSel}">
                </option>
            </select>
        </div>

        <div class="col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-success">
                Filtrar
            </button>

            <a th:href="@{/sensores}"
               class="btn btn-outline-secondary">
                Limpiar
            </a>
        </div>

    </form>

    <div th:if="${#lists.isEmpty(sensores)}"
         class="alert alert-info">
        No hay sensores para mostrar.
    </div>

    <div th:unless="${#lists.isEmpty(sensores)}"
         class="table-responsive">

        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th scope="col">N.º</th>
                <th scope="col">Nombre</th>
                <th scope="col">Modelo</th>
                <th scope="col">Tipo</th>
                <th scope="col">Unidad</th>
                <th scope="col">Estado</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="s, estado : ${sensores}">
                <td th:text="${estado.count}"></td>

                <td>
                    <a th:href="@{/sensores/{id}(id=${s.id})}"
                       th:text="${s.name}">
                        Nombre del sensor
                    </a>
                </td>

                <td th:text="${s.model}"></td>

                <td>
                    <span class="badge text-bg-success"
                          th:text="${s.tipo}">
                    </span>
                </td>

                <td th:text="${s.unidadMedida ?: 'Sin indicar'}"></td>
                <td th:text="${s.estado ?: 'Sin indicar'}"></td>

                <td>
                    <a th:href="@{/sensores/{id}/editar(id=${s.id})}"
                       class="btn btn-sm btn-outline-primary">
                        Editar
                    </a>
                    <button th:replace="~{fragmentos/comunes :: botonEliminar(
                        @{/sensores/{id}/eliminar(id=${s.id})},
                        ${s.name})}">
                    </button>


                </td>

            </tr>
            </tbody>

            <tfoot>
            <tr>
                <td colspan="7">
                    Sensores mostrados:
                    <strong th:text="${#lists.size(sensores)}">0</strong>
                </td>

            </tr>
            </tfoot>
        </table>
    </div>
</section>

</body>
</html>
