<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>lista</title>
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Listado de Parcelas</h1>
    <a th:href="@{/parcelas/nueva}" class="btn btn-primary">+ Nueva parcela</a>
</div>

<table class="table table-striped table-hover" th:if="${!parcelas.isEmpty()}">
    <thead class="table-dark">
    <tr>
        <th>Nombre</th>
        <th>Ubicación</th>
        <th>Superficie (ha)</th>
        <th>Cultivo</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${parcelas}">
        <td><a th:href="@{/parcelas/{id}(id=${p.id})}" th:text="${p.nombre}" class="text-decoration-none fw-bold"></a></td>
        <td th:text="${p.ubicacion}"></td>
        <td th:text="${p.superficie}"></td>
        <td th:text="${p.tipoCultivo?.etiqueta}"></td>
        <td>
            <form th:action="@{/parcelas/{id}/eliminar(id=${p.id})}" method="post" onsubmit="return confirm('¿Seguro que quieres eliminar esta parcela?');" style="display:inline;">
                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${parcelas.isEmpty()}" class="alert alert-warning text-center">
    No hay parcelas registradas en el sistema.
</div>

</body>
</html>
