<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Formulario</title>
</head>
<body class="container mt-5">

<div class="w-50 mx-auto">
    <h1 class="mb-4">Nueva Parcela</h1>

    <form th:action="@{/parcelas}" th:object="${parcela}" method="post" class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="nombre" class="form-label fw-bold">Nombre</label>
            <input type="text" id="nombre" class="form-control" th:field="*{nombre}" required>
        </div>

        <div class="mb-3">
            <label for="ubicacion" class="form-label fw-bold">Ubicación</label>
            <input type="text" id="ubicacion" class="form-control" th:field="*{ubicacion}" required>
        </div>

        <div class="mb-3">
            <label for="superficie" class="form-label fw-bold">Superficie (ha)</label>
            <input type="number" id="superficie" class="form-control" th:field="*{superficie}" step="0.01" min="0.01" required>
        </div>

        <div class="mb-3">
            <label for="tipoCultivo" class="form-label fw-bold">Cultivo</label>
            <select id="tipoCultivo" class="form-select" th:field="*{tipoCultivo}" required>
                <option value="">-- Selecciona un cultivo --</option>
                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.etiqueta}"></option>
            </select>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/parcelas}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success px-4">Guardar</button>
        </div>
    </form>
</div>

</body>
</html>
